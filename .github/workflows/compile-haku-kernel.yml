#=====================================================================================
# haku-wrt: compile the 6.18.y kernel for NSY-G68-Plus
# Source:  kagaminehaku/linux-6.18.y (fork of ophub/linux-6.18.y)
# Config:  compile-kernel/tools/config/config-6.18 (vendored)
# Runs the vendored compile script natively on an arm64 runner with the system gcc
# and publishes <version>.tar.gz to the kernel_stable release of this repository.
#=====================================================================================

name: Compile haku-wrt kernel

on:
  workflow_dispatch:
    inputs:
      kernel_auto:
        description: "Use the latest 6.18.y in kagaminehaku/linux-6.18.y"
        required: false
        default: true
        type: boolean
      kernel_sign:
        description: "Kernel signature (uname -r suffix)"
        required: false
        default: "-ophub"
      delete_source:
        description: "Delete source after compilation"
        required: false
        default: true
        type: boolean

env:
  TZ: Etc/UTC
  KERNEL_VERSION: 6.18.y
  KERNEL_OWNER: kagaminehaku
  BUILD_PATH: /builder/haku

jobs:
  build:
    runs-on: ubuntu-26.04-arm
    if: ${{ github.event.repository.owner.id == github.event.sender.id }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create virtual disk for extended storage
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc 2>/dev/null || true
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile

          root_avail=$(df --block-size=1G / | tail -1 | awk '{print $4}')
          root_size=$(( root_avail - 4 ))
          [[ "${root_size}" -gt 20 ]] || { echo "Error: Insufficient space on /: ${root_avail}G available"; exit 1; }

          sudo truncate -s "${root_size}"G /root.img
          build_dev=$(sudo losetup --find --show /root.img)
          sudo mkfs.xfs -f -i sparse=0 -b size=4096 "${build_dev}"
          sudo mkdir -p /builder
          sudo mount "${build_dev}" /builder
          df -Th

      - name: Prepare initramfs tools for uInitrd
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -y update
          sudo apt-get -y install initramfs-tools u-boot-tools
          # Same hook as Armbian: convert initrd.img-<version> into uInitrd-<version>
          sudo install -D -m 0755 compile-kernel/tools/initramfs/post-update.d/99-uboot \
              /etc/initramfs/post-update.d/99-uboot

      - name: Compile the kernel [ ${{ env.KERNEL_VERSION }} ]
        env:
          KERNEL_AUTO: ${{ inputs.kernel_auto }}
          KERNEL_SIGN: ${{ inputs.kernel_sign }}
          DELETE_SOURCE: ${{ inputs.delete_source }}
        run: |
          sudo mkdir -p "${BUILD_PATH}"
          sudo cp -a compile-kernel "${BUILD_PATH}/"
          cd "${BUILD_PATH}"
          sudo bash compile-kernel/tools/script/armbian_compile_kernel.sh \
              -r "${KERNEL_OWNER}" \
              -k "${KERNEL_VERSION}" \
              -a "${KERNEL_AUTO}" \
              -m all \
              -t gcc \
              -n "${KERNEL_SIGN}" \
              -d "${DELETE_SOURCE}"

          ls -lh compile-kernel/output/
          ls compile-kernel/output/[0-9]*.tar.gz >/dev/null || { echo "Error: no kernel package was built"; exit 1; }

      - name: Upload kernel to the kernel_stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # <version>.tar.gz (boot, modules, dtb, header) is what remake downloads
          kernel_files=("${BUILD_PATH}"/compile-kernel/output/[0-9]*.tar.gz)
          if gh release view kernel_stable >/dev/null 2>&1; then
              gh release upload kernel_stable "${kernel_files[@]}" --clobber
          else
              gh release create kernel_stable "${kernel_files[@]}" \
                  --title "kernel_stable" --latest=false \
                  --notes "Kernels for haku-wrt (NSY-G68-Plus), built from ${KERNEL_OWNER}/linux-${KERNEL_VERSION} with compile-kernel/tools/config."
          fi
